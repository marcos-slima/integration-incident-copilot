[project]
name = "integration-incident-copilot"
version = "1.4.0"
description = "Assistente de IA para diagnóstico de incidentes de integração SAP (RAG + agentes + conectores SAP)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["copilot-core==1.4.0"]

[project.optional-dependencies]
openai = ["copilot-core[openai]==1.4.0"]
prometheus = ["copilot-core[prometheus]==1.4.0"]

[tool.uv]
# CVE-2026-97687/97688/97689 no urllib3 2.7.0 (fix: 2.8.0). urllib3 e'
# transitivo (requests, langfuse, etc.), entao nao ha linha `urllib3=` em
# dependencies para subir o piso. Uma constraint e' o mecanismo correto: ela
# governa a resolucao sem declarar uma dependencia que o projeto nao usa
# diretamente. Sem isto o pip-audit mantem o processo de seguranca verde
# sobre uma versao com CVE conhecida.
constraint-dependencies = ["urllib3>=2.8.0"]

# DEP-01: torch so-CPU no Linux (imagem, CI e a maquina de desenvolvimento).
# macOS/Windows continuam no PyPI (as rodas de la ja sao so-CPU).
[tool.uv.workspace]
members = ["packages/core", "packages/dfe"]

[tool.uv.sources]
copilot-core = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint.isort]
known-first-party = ["app", "iic_copilot"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["iic_copilot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "httpx>=0.28.1",
    # DA-29: usados so por scripts/benchmark_rerankers.py
    "huggingface-hub>=0.30",
    "langchain-openai>=1.6.0",
    "pre-commit>=4.6.1",
    "psutil>=7.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.20",  # driver async SQLite para testes (test_incident_repository)
    "ruff>=0.16.1",
    # B4: ferramentas de qualidade exigidas pelo CI (tests.yml)
    "pytest-cov>=6.0",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: precisa de Playwright + Chromium; pulado quando ausentes (tests/test_admin_ui_browser.py)",
    "integration: requer stack local viva (Qdrant/Ollama); pulado automaticamente se indisponivel",
    # Avaliacao externa (medio prazo, item 7): smoke test do GraphRAG
    # contra um Neo4j REAL (nao o FakeSession de tests/test_graph_store.py).
    # Selecionado explicitamente pelo job dedicado "neo4j-smoke" do CI
    # (.github/workflows/tests.yml, "pytest -m neo4j_smoke"). Nao leva
    # o marker "integration" acima de proposito (ver docstring de
    # tests/test_graph_store_neo4j_smoke.py) - a propria fixture do
    # teste pula (pytest.skip) quando NEO4J_URI/NEO4J_PASSWORD nao
    # estao configuradas, o que ja cobre "sem Neo4j disponivel" tanto
    # localmente quanto no job padrao "test" ('-m "not integration"').
    "neo4j_smoke: requer um Neo4j real vivo (GRAPH_RAG_ENABLED + credenciais); ver job 'neo4j-smoke' do CI",
    "postgres_smoke: DA-69 contra Postgres real (IIC_TEST_DATABASE_URL); pula sozinho sem banco - tests/test_checkpointing_postgres.py",
    "rag_quality: quality gate RAG contra Qdrant real com dataset de avaliacao; ver job 'rag-quality' do CI",
]
