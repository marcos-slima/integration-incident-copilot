name: Pytest

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancela execuções antigas do mesmo branch quando um novo push chega
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python
        # Lê a versão de .python-version (3.12.13), a mesma do ambiente local
        run: uv python install

      - name: Sincronizar dependências
        run: uv sync --dev

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — formatação
        run: uv run ruff format --check .

      - name: Pytest
        # Exclui testes marcados como integration: eles exigem Qdrant e Ollama,
        # que não existem no runner do GitHub.
        # §3.10: --cov + --cov-fail-under=80 — CI falha se cobertura < 80%.
        run: uv run pytest -m "not integration" -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80


  security:
    name: security — pip-audit + bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # §3.10: pip-audit verifica CVEs nas dependencias; bandit faz SAST.
    # pip-audit: continue-on-error: true para nao bloquear o CI por CVEs
    # em dependencias transitivas sem fix disponivel.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python
        run: uv python install

      - name: Sincronizar dependências
        run: uv sync --dev

      - name: pip-audit — CVEs nas dependências
        continue-on-error: true
        run: uv run pip-audit --requirement <(uv export --no-dev --format requirements-txt)

      - name: bandit — SAST Python
        run: uv run bandit -r app/ -ll -f json -o bandit-report.json || uv run bandit -r app/ -ll

      - name: Upload relatórios de segurança
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
          if-no-files-found: ignore

  compose-smoke:
    name: compose smoke — API /health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # §3.10: smoke test que sobe o stack real via docker compose.
    # Valida que a API sobe e responde /health sem LLM (OLLAMA_HOST
    # aponta para host inexistente — intencional, so testa o startup).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir stack (api + qdrant)
        run: docker compose up -d api qdrant
        env:
          LLM_PROVIDER: ollama
          OLLAMA_HOST: http://localhost:11434
          LLM_MODEL: qwen3-coder-next:latest

      - name: Aguardar API responder /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API pronta."
              exit 0
            fi
            echo "Aguardando API (tentativa $i/30)..."
            sleep 3
          done
          echo "API nao respondeu a tempo." >&2
          docker compose logs api
          exit 1

      - name: Derrubar stack
        if: always()
        run: docker compose down -v

  neo4j-smoke:
    name: smoke test GraphRAG (Neo4j real)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Avaliacao externa (medio prazo, item 7): "smoke test com Neo4j
    # no CI (service container)". Job separado do "lint + tests"
    # acima (que roda com "-m 'not integration'", sem nenhuma
    # infraestrutura externa) - os testes existentes de
    # app/rag/graph_store.py usam um FakeSession em memoria, nunca
    # validados contra um Neo4j de verdade (schema/constraints em
    # runtime, apontado como risco pela revisao). Este job sobe um
    # Neo4j real como "service container" do GitHub Actions e roda
    # so tests/test_graph_store_neo4j_smoke.py (marker "neo4j_smoke",
    # ver pyproject.toml).
    services:
      neo4j:
        image: neo4j:5.26.0-community
        env:
          NEO4J_AUTH: neo4j/smoke-test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python
        run: uv python install

      - name: Sincronizar dependências
        run: uv sync --dev

      - name: Aguardar Neo4j aceitar conexoes Bolt
        # O healthcheck HTTP acima (porta 7474) so garante que o
        # processo subiu - a porta Bolt (7687, usada pelo driver
        # app/rag/graph_store.py) pode demorar mais alguns segundos.
        run: |
          for i in $(seq 1 30); do
            if uv run python -c "
          from neo4j import GraphDatabase
          driver = GraphDatabase.driver('bolt://127.0.0.1:7687', auth=('neo4j', 'smoke-test-password'))
          driver.verify_connectivity()
          driver.close()
          "; then
              echo "Neo4j pronto."
              exit 0
            fi
            echo "Aguardando Neo4j (tentativa $i/30)..."
            sleep 2
          done
          echo "Neo4j nao respondeu a tempo." >&2
          exit 1

      - name: Pytest — smoke test GraphRAG
        env:
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: smoke-test-password
        run: uv run pytest -m neo4j_smoke -v --tb=short

  frontend:
    name: frontend — typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Avaliacao externa (nova revisao, P0/item 25): CI nunca
    # typechecava/lintava/buildava o frontend (React/Vite) - o job
    # "test" acima roda so pytest/ruff (Python). Este job novo cobre
    # exatamente o que "npm run build" faz (tsc -b + vite build,
    # ver frontend/package.json) e "npm run lint" (oxlint), pegando
    # erros de tipo/lint do frontend no CI pela primeira vez.
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck + build (tsc -b && vite build)
        run: npm run build

  docker-build:
    name: valida build da imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Avaliacao externa (nova revisao, P0/item 1 e item 25): o
    # Dockerfile multi-stage (que builda o frontend com
    # "npm run build" e copia static/dist/ para a imagem final) nunca
    # tinha sido exercitado pelo CI - só localmente, manual. Sem isso,
    # uma regressão no Dockerfile (ex: path errado no COPY
    # --from=frontend-build) só apareceria num "docker compose up" de
    # alguém, não no CI. Não faz push da imagem (sem registry
    # configurado nesta fase) - só prova que "docker build ." termina
    # com sucesso.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: docker build
        run: docker build -t integration-incident-copilot:ci .
