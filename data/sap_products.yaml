    note: "Linha acrescentada por nos, pelo mesmo motivo da anterior. O repo tem `APIManagementConnector`, com schema ESPECULATIVO."
    mechanisms: {apis: unknown, events: unknown, idoc: unknown, rfc: unknown, soap: unknown, odata: unknown, files: unknown, data_integration: unknown, integration_suite: unknown}

  # --- nao-SAP: o repo tem conector, a fonte nao cobre ----------------------
  - name: ServiceNow
