  - name: EWM
    kind: sap_product
    mechanisms: {apis: supported, events: supported, idoc: native, rfc: native, soap: supported, odata: supported, files: supported, data_integration: none, integration_suite: supported}

  - name: TM
    kind: sap_product
    mechanisms: {apis: supported, events: supported, idoc: native, rfc: native, soap: supported, odata: supported, files: supported, data_integration: none, integration_suite: supported}

  - name: GTS
    kind: sap_product
    mechanisms: {apis: supported, events: conditional, idoc: native, rfc: native, soap: supported, odata: supported, files: supported, data_integration: none, integration_suite: supported}

  - name: Commerce
    kind: sap_product
