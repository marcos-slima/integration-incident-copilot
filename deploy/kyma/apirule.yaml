# DA-24: APIRule (modulo API Gateway do Kyma) - expoe o Service via o
# Istio Gateway gerenciado pelo Kyma, sem precisar configurar Istio
# VirtualService/Gateway manualmente.
#
# IIC-AUD-402 (2026-10-21): migrado de v1beta1 para v2. O v1beta1 foi
# removido do modulo API Gateway: nao aceita mais create/edit, e desde a
# release 3.10 nao e reconciliado (prazo de migracao no BTP: 19/08/2026
# canal fast, 02/09/2026 regular). Fonte: "Migrate APIRule from Version
# v1beta1 to Version v2" (kyma-project.io). Schema conferido contra o CRD
# `config/crd/bases/gateway.kyma-project.io_apirules.yaml` do repositorio
# kyma-project/api-gateway (versao v2: `hosts` e `rules` obrigatorios;
# `methods` e `path` obrigatorios por regra).
#
# Mudancas em relacao ao v1beta1:
#   - `host` -> `hosts` (lista). Usamos o short host name (um rotulo RFC
#     1123): o modulo completa com o dominio default do gateway, entao nao
#     ha mais placeholder <CLUSTER_DOMAIN> para editar.
#   - `accessStrategies: [{handler: noop}]` -> `noAuth: true` por regra.
#     Sem autenticacao no gateway e correto aqui porque o Copilot ja
#     autentica cada endpoint (X-API-Key, X-A2A-Api-Key,
#     X-Event-Mesh-Api-Key, X-API-Admin-Key - DA-18/DA-23/DA-46). O caminho
#     recomendado para producao e `jwt` com o IAS/XSUAA do subaccount
#     (issuer + jwksUri), que troca as API keys por token/roles do BTP.
#   - `/*` continua valido no v2 (equivale a `/{**}`).
#
# Ainda NAO validado contra um cluster Kyma real (trial bloqueado). Antes de
# aplicar: `kubectl explain apirule.spec --api-version=gateway.kyma-project.io/v2`
# e `kubectl apply --dry-run=server -k deploy/kyma`.
apiVersion: gateway.kyma-project.io/v2
kind: APIRule
metadata:
  name: integration-incident-copilot
  namespace: integration-incident-copilot
spec:
  hosts:
    - integration-incident-copilot
  service:
    name: integration-incident-copilot
    port: 80
  gateway: kyma-system/kyma-gateway
  rules:
    - path: /*
      # Validacao 2026-10-07 (DEP-01): PATCH/PUT/DELETE faltavam - o painel
      # admin (PATCH/DELETE em /admin/*) devolvia 404/405 no gateway, mesmo
      # funcionando local. OPTIONS nao e necessario (SPA same-origin).
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
      noAuth: true
