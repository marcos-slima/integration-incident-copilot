name: Quality gate

# DA-51: o que a suite nao cobre.
#   deterministico          — sempre. Sem LLM, sem infra, segundos.
#   migrations + dashboards — Postgres efemero; valida alembic E as 45 queries.
#   llm_eval                — manual, em runner com Ollama+Qdrant; nao roda no agendado.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # 03:17 UTC — fora do horario pico dos runners hospedados.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Label do runner (use self-hosted com Ollama+Qdrant para llm_eval)"
        required: false
        default: "ubuntu-latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: quality gate — deterministico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.17"  # IIC-AUD-313: mesmo pin do Dockerfile:41
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python
        run: uv python install

      - name: Sincronizar dependências
        run: uv sync --dev

      - name: Quality gate (dataset, corpus, invariante DA-29, configs, docs)
        run: |
          set -o pipefail
          uv run python scripts/quality_gate.py --json quality-gate.json | tee quality-gate.log
          {
            echo "## Quality gate (DA-51)"
            echo
            echo '```json'
            cat quality-gate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-gate-report
          path: quality-gate.json
          if-no-files-found: warn

  migrations_and_dashboards:
    name: migrations + 45 queries dos dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iic
          POSTGRES_PASSWORD: iic
          POSTGRES_DB: iic
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://iic:iic@localhost:5432/iic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.17"  # IIC-AUD-313: mesmo pin do Dockerfile:41
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python
        run: uv python install

      - name: Sincronizar dependências
        run: uv sync --dev

      # Alembic so foi validado a mao (DA-49 migration 004). Aqui ele roda
      # contra banco limpo: migration que so funciona na sua base local
      # quebra o primeiro deploy de outra pessoa.
      - name: Alembic upgrade head (banco limpo)
        run: uv run alembic upgrade head

      # Validacao 2026-10-07 (DB-01): o metadata do alembic/env.py nao
      # importava SystemContract nem Incident, e `alembic revision
      # --autogenerate` propunha DROP TABLE da tabela append-only. `alembic
      # check` falha se modelos e migrations divergirem em qualquer direcao.
      - name: Alembic check (modelos == migrations)
        run: uv run alembic check

      - name: Validar as queries dos dashboards no Postgres real
        run: uv run python scripts/validate_dashboards.py --dsn "$DATABASE_URL"

      # DA-52: o detector de drift so se prova atravessando o caminho
      # completo -- $metadata servido por HTTP -> parser -> baseline no
      # Postgres -> diff -> CloudEvent. Teste unitario com base em memoria
      # passaria mesmo com migration, coluna ou mapping divergentes.
      # Usa o MESMO Postgres efemero acima (ja aplicou a 005).
      - name: DA-52 end-to-end (contrato -> baseline -> incidente)
        env:
          IIC_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: uv run pytest tests/test_contracts_e2e.py -v

      # IIC-AUD-408: estes testes pulam sem IIC_TEST_DATABASE_URL e por isso
      # nunca rodavam no CI. Cobrem a retomada do grafo pelo PostgresSaver
      # sem PII (DA-69/75) e o upsert atomico sob concorrencia (M-11). Usam
      # o MESMO Postgres efemero, ja migrado acima.
      - name: Checkpoint Postgres (DA-69/75) e concorrencia (M-11)
        env:
          IIC_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: uv run pytest tests/test_checkpointing_postgres.py tests/test_bloco3_observabilidade.py -v

  llm_eval:
    name: promptfoo — gate de LLM
    # Manual: o provider dos configs e local (exec:) e precisa de Ollama,
    # Qdrant com o corpus ingerido e o modelo de 35B. O runner hospedado
    # nao tem nada disso; agendar so produzia falha diaria.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.17"  # IIC-AUD-313: mesmo pin do Dockerfile:41
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verificar infraestrutura (Ollama + Qdrant)
        id: infra
        env:
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
        run: |
          ollama_host="${OLLAMA_HOST:-http://127.0.0.1:11434}"
          qdrant_url="${QDRANT_URL:-http://127.0.0.1:6333}"
          ok=true
          if curl -sf --max-time 5 "$ollama_host/api/tags" >/dev/null; then
            echo "Ollama: ok"
          else
            echo "Ollama: inacessivel em $ollama_host"
            ok=false
          fi
          if curl -sf --max-time 5 "$qdrant_url/healthz" >/dev/null; then
            echo "Qdrant: ok"
          else
            echo "Qdrant: inacessivel em $qdrant_url"
            ok=false
          fi
          echo "configured=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != true ]; then
            {
              echo "## promptfoo — NAO EXECUTADO"
              echo
              echo "O runner nao tem Ollama e/ou Qdrant acessiveis. O gate de LLM"
              echo "nao rodou; este job **nao** e um verde."
              echo
              echo "Use um runner self-hosted com Ollama (modelo qwen3.6:35b-a3b)"
              echo "e Qdrant com o corpus ingerido, e dispare com runner=self-hosted."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Falhar sem infraestrutura de LLM
        if: steps.infra.outputs.configured != 'true'
        run: |
          echo "::error::promptfoo nao executado: Ollama/Qdrant indisponiveis no runner."
          exit 1

      - name: promptfoo eval
        if: steps.infra.outputs.configured == 'true'
        run: npx --yes promptfoo@0.124.1 eval -c promptfooconfig.yaml -o resultados.json

      - name: Comparar com o baseline versionado
        if: steps.infra.outputs.configured == 'true'
        run: uv run python scripts/quality_gate.py --compare-promptfoo resultados.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: promptfoo-results
          path: resultados.json
          if-no-files-found: ignore
