# B-02: worker RQ que consome a fila "diagnosis" - processa os eventos
# enfileirados por POST /events/incident (e POST /diagnose/async). Sem
# ele, com REDIS_URL configurada, os eventos ficariam na fila sem
# processamento. Mesma imagem, ConfigMap e Secret da API
# (deployment.yaml); mesmo equivalente ao servico "worker" do
# docker-compose.yml.
#
# Pre-requisito: o Redis apontado por REDIS_URL (secret.example.yaml) - nao
# faz parte deste bundle de manifests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-incident-copilot-worker
  namespace: integration-incident-copilot
  labels:
    app.kubernetes.io/name: integration-incident-copilot-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: integration-incident-copilot-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: integration-incident-copilot-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "<REGISTRY>/integration-incident-copilot:<TAG>"
          command: ["/app/.venv/bin/rq"]
          # IIC-AUD-314: RQ CLI lê RQ_REDIS_URL via env (rq/cli/helpers.py:393).
          # Passar --url "$(REDIS_URL)" expoe a senha em ps/kubectl describe.
          args: ["worker", "diagnosis"]
          env:
            - name: RQ_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: integration-incident-copilot-secrets
                  key: REDIS_URL
          envFrom:
            - configMapRef:
                name: integration-incident-copilot-config
            - secretRef:
                name: integration-incident-copilot-secrets
          # Validacao 2026-10-07 (DEP-01): o worker executa o MESMO grafo
          # de diagnostico da API (retriever + reranker), entao precisa da
          # mesma memoria (~1,2 GB residente medido). 512Mi era OOMKill
          # garantido no primeiro job.
          resources:
            requests:
              cpu: "250m"
              memory: "1536Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # IIC-AUD-314: liveness probe — rq nao expoe HTTP, usa exec.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'python -c "import redis; r=redis.from_url(__import__(\"os\").environ[\"RQ_REDIS_URL\"]); r.ping()"'
            initialDelaySeconds: 30
            periodSeconds: 15
