    mechanisms: {apis: supported, events: none, idoc: none, rfc: none, soap: none, odata: supported, files: supported, data_integration: native, integration_suite: supported}

  - name: BW/4HANA
    kind: sap_product
    mechanisms: {apis: supported, events: none, idoc: none, rfc: none, soap: none, odata: supported, files: supported, data_integration: native, integration_suite: supported}

  - name: SAC
    kind: sap_product
    mechanisms: {apis: supported, events: none, idoc: none, rfc: none, soap: none, odata: supported, files: supported, data_integration: supported, integration_suite: supported}

