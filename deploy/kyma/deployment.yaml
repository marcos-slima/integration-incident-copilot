# DA-24: Deployment da API. A imagem usa o Dockerfile deste repositorio
# (corrigido nesta mesma fase: uv.lock + --frozen para build
# reproduzivel, usuario nao-root, CMD chamando .venv/bin/uvicorn direto
# - ver Dockerfile e docs/DEPLOY.md secao 4).
#
# <REGISTRY>/integration-incident-copilot:<tag> e um placeholder - troque
# pelo registry real (ex: o Docker registry gerenciado pela conta BTP,
# ou qualquer registry que o cluster Kyma consiga puxar).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-incident-copilot
  namespace: integration-incident-copilot
  labels:
    app.kubernetes.io/name: integration-incident-copilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: integration-incident-copilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: integration-incident-copilot
    spec:
      # DA-24: mesmo UID nao-root criado no Dockerfile (appuser, uid
      # 1000) - reforcado aqui a nivel de Pod, nao so de imagem, para
      # que um PodSecurityStandard "restricted" do cluster nao rejeite
      # o Pod mesmo se alguem trocar a imagem sem perceber essa
      # exigencia.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "<REGISTRY>/integration-incident-copilot:<TAG>"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: integration-incident-copilot-config
            - secretRef:
                name: integration-incident-copilot-secrets
          # §4.3: liveness e readiness agora apontam para endpoints
          # distintos (avaliacao externa §3.6 — antes ambos usavam /health,
          # que apos DA-35 passou a fazer probe de Qdrant/Ollama, causando
          # restart-loop incorreto quando o Qdrant esta fora).
          # /health = liveness: processo FastAPI vivo? (sem IO externo)
          # /ready  = readiness: Qdrant/Ollama/Redis acessiveis? (B-07)
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            # /ready faz ate 3 probes sequenciais (Qdrant/Ollama/Redis, 1s
            # cada) - o timeout default de 1s do kubelet cortaria a resposta.
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # Validacao 2026-10-07 (DEP-01): medido com o venv da imagem
          # (torch CPU): ~684 MB de RSS apos importar app.main e ~1156 MB
          # com o reranker carregado, antes de qualquer diagnostico. O limite
          # antigo de 1024Mi ficava ABAIXO do residente em regime e terminava
          # em OOMKill no primeiro /diagnose. Request = regime + folga para
          # o scheduler nao empacotar o pod num no sem memoria; limit cobre
          # o pico de um diagnostico (contexto RAG + resposta do LLM).
          resources:
            requests:
              cpu: "250m"
              memory: "1536Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
