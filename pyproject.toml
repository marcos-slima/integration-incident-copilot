[project]
name = "integration-incident-copilot"
version = "1.4.0"
description = "Produto IIC sobre Copilot Platform"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["copilot-core==1.4.1", "torch>=2.14.1"]

[project.optional-dependencies]
openai = ["copilot-core[openai]==1.4.1"]
prometheus = ["copilot-core[prometheus]==1.4.1"]

[tool.uv.sources]
copilot-core = { url = "https://github.com/marcos-slima/copilot-platform/releases/download/core%2Fv1.4.1/copilot_core-1.4.1-py3-none-any.whl" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iic_copilot"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.1", "pytest-cov>=6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
