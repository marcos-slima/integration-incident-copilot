{% extends "base.html" %}
{% block title %}Sistemas integrados · Admin{% endblock %}
{% block content %}
<h2>Sistemas integrados (DA-49)</h2>
<button onclick="loadSystems()">Recarregar</button>
<table id="systems">
  <thead><tr>
    <th>system_key</th><th>Nome</th><th>Vendor</th><th>Conector</th>
    <th>Ambiente</th><th>status</th><th>base_url</th><th>Ações</th>
  </tr></thead>
  <tbody id="systems-body"><tr><td colspan="8">carregando…</td></tr></tbody>
</table>

<h3>Novo sistema</h3>
<form id="newsystem" onsubmit="return addSystem(event)">
  <input name="system_key" placeholder="slug (ex: sap_odata_prod)" required>
  <input name="name" placeholder="nome (ex: SAP OData — Produção)" required>
  <input name="vendor" placeholder="vendor (ex: SAP, ServiceNow)" required>
  <select name="connector_type">
    <option value="odata">odata</option>
    <option value="rfc">rfc</option>
    <option value="servicenow">servicenow</option>
    <option value="salesforce">salesforce</option>
    <option value="workday">workday</option>
    <option value="ariba">ariba</option>
    <option value="cap">cap</option>
    <option value="apim">apim</option>
  </select>
  <select name="environment">
    <option value="prod">prod</option>
    <option value="stage">stage</option>
    <option value="dev">dev</option>
    <option value="test">test</option>
  </select>
  <select name="status">
    <option value="active">active</option>
    <option value="degraded">degraded</option>
    <option value="offline">offline</option>
    <option value="trial">trial</option>
  </select>
  <input name="base_url" placeholder="base_url (opcional)">
  <input name="notes" placeholder="notas (opcional)">
  <button type="submit">Adicionar</button>
</form>

<p class="warn" id="msg"></p>

<script>
function loadSystems() {
  adminFetch('/admin/api/systems').then(r => {
    if (r.status === 401) throw new Error('chave admin inválida — insira em cima');
    if (r.status === 503) throw new Error('DB não configurado (DATABASE_URL ausente)');
    return r.json();
  }).then(rows => {
    const tb = document.getElementById('systems-body');
    tb.innerHTML = '';
    if (!rows.length) { tb.innerHTML = '<tr><td colspan="8">nenhum sistema registrado</td></tr>'; return; }
    for (const s of rows) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${escapeHtml(s.system_key)}</td>
        <td>${escapeHtml(s.name)}</td>
        <td>${escapeHtml(s.vendor)}</td>
        <td>${escapeHtml(s.connector_type)}</td>
        <td>${escapeHtml(s.environment)}</td>
        <td>${pill(s.status)}</td>
        <td>${escapeHtml(s.base_url || '—')}</td>
        <td>
          <a href="/admin/incidents?system_key=${encodeURIComponent(s.system_key)}">incidentes</a>
          <button onclick="toggleStatus('${s.id}', '${s.status === 'active' ? 'degraded' : 'active'}')">
            ${s.status === 'active' ? 'marcar degradado' : 'marcar ativo'}</button>
          <button onclick="delSystem('${s.id}')">remover</button>
        </td>`;
      tb.appendChild(tr);
    }
  }).catch(e => document.getElementById('msg').textContent = e.message);
}
function toggleStatus(id, target) {
  adminFetch('/admin/api/systems/' + id, {method:'PATCH', body: JSON.stringify({status: target})})
    .then(() => loadSystems()).catch(e => document.getElementById('msg').textContent = e.message);
}
function delSystem(id) {
  if (!confirm('Remover este sistema?')) return;
  adminFetch('/admin/api/systems/' + id, {method:'DELETE'})
    .then(() => loadSystems()).catch(e => document.getElementById('msg').textContent = e.message);
}
function addSystem(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const body = Object.fromEntries([...f.entries()].map(([k,v]) => [k, v === '' ? null : v]));
  adminFetch('/admin/api/systems', {method:'POST', body: JSON.stringify(body)})
    .then(r => r.ok ? loadSystems() : r.json().then(j => { throw new Error(j.detail); }))
    .then(() => e.target.reset())
    .catch(err => document.getElementById('msg').textContent = err.message);
  return false;
}
loadSystems();
</script>
{% endblock %}
