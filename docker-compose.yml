services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:32b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      QDRANT_URL: http://qdrant:6333
      # Langfuse e opcional - sem chaves, o app roda normal, so sem
      # tracing (ver app/config.py). Aponte para um Langfuse externo
      # (self-hosted ou cloud) via .env se quiser observabilidade.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    depends_on:
      - ollama
      - qdrant
    volumes:
      - ./data/sample_docs:/app/data/sample_docs:ro

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  ollama_data:
  qdrant_data:
