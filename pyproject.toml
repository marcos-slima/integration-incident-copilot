[project]
name = "integration-incident-copilot"
version = "1.2.0"
description = "Assistente de IA para diagnóstico de incidentes de integração SAP (RAG + agentes + conectores SAP)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-community>=0.4",
    "langchain-ollama>=1.1",
    "qdrant-client>=1.19",
    "neo4j>=6.2",
    "langfuse>=4.14",
    "python-dotenv>=1.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.15.0",
    "pydantic-settings>=2.14.2",
    # runtime (nao so teste): usado pelo ServiceNowConnector para
    # chamadas HTTP reais contra a Table API
    "httpx>=0.27",
    "fastembed>=0.8.0",
    "numpy>=2.5.1",
    "aiofiles>=25.1.0",
    "ddgs>=9.16.0",
    "pymupdf4llm>=1.28.2",
    "sentence-transformers>=6.0.1",
    "slowapi>=0.1.10",
    "mcp>=1.9.0",
    # Opcional em runtime (REDIS_URL vazio = nao usado, ver
    # app/a2a/task_store.py e app/queue.py) - declarado como
    # dependencia principal (nao um extra) pelo mesmo motivo de
    # "neo4j" acima: import tardio (so acontece se a feature estiver
    # configurada), mas sem exigir um "pip install" extra do operador
    # quando ele decide ligar REDIS_URL.
    "redis>=5.2",
    # AMQP 1.0 puro Python para Solace Cloud / SAP AEM (DA-32)
    "aiormq>=6.8",
    # Fila assincrona de diagnostico (app/queue.py) - mesmo Redis do
    # REDIS_URL acima, so importado/usado se REDIS_URL estiver
    # configurada. Sem isso o "worker" opt-in (docker-compose.yml,
    # profile "async") nao teria o que rodar.
    "rq>=2.12.0",
]

# Opcional: so necessario se LLM_PROVIDER=openai ou azure_openai no
# .env (default e "ollama", que nao precisa disso). Mantido fora das
# dependencias principais de proposito - o caminho local-first nao
# deve exigir instalar SDK de nenhum provedor de nuvem.
openai = [
    "langchain-openai>=0.3",
]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "httpx>=0.28.1",
    # DA-29: usados so por scripts/benchmark_rerankers.py
    "huggingface-hub>=0.30",
    "langchain-openai>=1.6.0",
    "pre-commit>=4.6.1",
    "psutil>=7.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requer stack local viva (Qdrant/Ollama); pulado automaticamente se indisponivel",
    # Avaliacao externa (medio prazo, item 7): smoke test do GraphRAG
    # contra um Neo4j REAL (nao o FakeSession de tests/test_graph_store.py).
    # Selecionado explicitamente pelo job dedicado "neo4j-smoke" do CI
    # (.github/workflows/tests.yml, "pytest -m neo4j_smoke"). Nao leva
    # o marker "integration" acima de proposito (ver docstring de
    # tests/test_graph_store_neo4j_smoke.py) - a propria fixture do
    # teste pula (pytest.skip) quando NEO4J_URI/NEO4J_PASSWORD nao
    # estao configuradas, o que ja cobre "sem Neo4j disponivel" tanto
    # localmente quanto no job padrao "test" ('-m "not integration"').
    "neo4j_smoke: requer um Neo4j real vivo (GRAPH_RAG_ENABLED + credenciais); ver job 'neo4j-smoke' do CI",
    "rag_quality: quality gate RAG contra Qdrant real com dataset de avaliacao; ver job 'rag-quality' do CI",
]
