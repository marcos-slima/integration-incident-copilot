# Grafana datasource provisioning — PostgreSQL (Integration Incident Copilot)
# Fonte de verdade para dashboards COI/IOC, SOC, iPaaS (Fase 3).
# TimescaleDB: se usar timescale/timescaledb como imagem, troque
#   type: postgres → type: timescaledb (plugin nativo do Grafana).
#
# Documentação Grafana:
#   https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources

apiVersion: 1

datasources:
  - name: PostgreSQL - IIC
    type: postgres
    uid: postgres_iic
    url: postgres:5432
    database: iic
    # Validacao 2026-10-07 (M-17): usuario/senha/sslmode vem do ambiente do
    # container (docker-compose.yml). Recomendado: GRAFANA_DB_USER=iic_grafana_ro
    # (papel somente leitura criado pela migration 013) em vez do dono do banco,
    # e GRAFANA_DB_SSLMODE=require fora da rede local do compose.
    user: "${GRAFANA_DB_USER}"
    secureJsonData:
      password: "${GRAFANA_DB_PASSWORD}"
    jsonData:
      sslmode: "${GRAFANA_DB_SSLMODE}"
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false     # true se usar TimescaleDB
    isDefault: true
    editable: false
