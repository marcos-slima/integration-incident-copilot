# §3.8: x-common-env extrai as variaveis de ambiente compartilhadas
# entre "api" e "worker" num anchor YAML — elimina a duplicata que
# existia antes (as mesmas 8 vars eram listadas duas vezes). Qualquer
# mudanca de valor agora e feita em UM so lugar.
x-common-env: &common-env
  LLM_PROVIDER: ollama
  OLLAMA_HOST: http://host.docker.internal:11434
  LLM_MODEL: ${LLM_MODEL:-qwen3-coder-next:latest}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  QDRANT_URL: http://qdrant:6333
  # Langfuse e opcional - sem chaves, o app roda normal, so sem
  # tracing (ver app/config.py). Aponte para um Langfuse externo
  # (self-hosted ou cloud) via .env se quiser observabilidade.
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  # Redis e opt-in (profile "async", ver servico abaixo) - vazio
  # por default: sem REDIS_URL, app/a2a/task_store.py cai no fallback
  # em memoria (§3.7: degradacao graciosamente).
  REDIS_URL: ${REDIS_URL:-}
  # Persistência de incidentes (Fase 1 Observabilidade Grafana)
  # Opt-in: vazio = sem PostgreSQL (padrão). Configure DATABASE_URL
  # no .env para ativar. Formato:
  #   postgresql+asyncpg://iic:iic@postgres:5432/iic
  DATABASE_URL: ${DATABASE_URL:-}

services:
  api:
    # DA-24: o "command:" que sobrescrevia o CMD do Dockerfile para
    # contornar o bug do "uv run" ressincronizando no startup (ver
    # docs/DEPLOY.md secao 4) nao e mais necessario - o Dockerfile ja
    # chama ".venv/bin/uvicorn" diretamente na origem.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    # §3.8: restart: unless-stopped — reinicia automaticamente apos
    # crash ou apos "docker compose restart", mas nao quando parado
    # manualmente ("docker compose stop"). Evita interrupco de servico
    # por falhas transitórias (OOM, excecao nao tratada, etc.).
    restart: unless-stopped
    # DA-34: condition: service_healthy garante que Qdrant e Ollama
    # estejam prontos antes da API comecar a servir requisicoes.
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./data/sample_docs:/app/data/sample_docs:ro

  ollama:
    image: ollama/ollama:0.34.1
    # DA-34: healthcheck — garante que Ollama esta pronto para servir
    # requisicoes antes da API comecar (condition: service_healthy abaixo).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:v1.19.0
    # DA-34: healthcheck — Qdrant expoe /healthz desde v1.3.0.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # PostgreSQL — persistência de incidentes (Fase 1 Observabilidade).
  # Opt-in via profile "observability": nao sobe no stack default para
  # manter o ambiente de desenvolvimento leve. Ativar:
  #   docker compose --profile observability up -d postgres grafana
  # TimescaleDB (para retenção automática + hypertable):
  #   Substituir imagem por timescale/timescaledb:latest-pg16
  postgres:
    image: postgres:16-alpine
    profiles: ["observability"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iic -d iic"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: iic
      POSTGRES_USER: iic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REQUIRED_SET_IN_ENV}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Grafana — dashboards COI/IOC, SOC, iPaaS (Fase 3 Observabilidade).
  # Opt-in via profile "observability" (mesmo do postgres acima).
  # Provisioning automático via ./deploy/grafana/ (Fase 3).
  # URL default: http://localhost:3001 (3000 reservado ao Langfuse local).
  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-REQUIRED_SET_IN_ENV}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy

  # GraphRAG (opt-in) - NAO sobe com "docker compose up" default, so
  # com "docker compose --profile graphrag up -d neo4j" (decisao
  # consciente de manter o stack default leve, ver Decisao de
  # Arquitetura #9 no README e docs/ARCHITECTURE.md). Ativar de verdade
  # exige tambem GRAPH_RAG_ENABLED=true no .env - ver
  # app/rag/graph_store.py.
  neo4j:
    image: neo4j:5.26.0-community
    profiles: ["graphrag"]
    # DA-34: healthcheck — Neo4j expoe /db/neo4j/available (HTTP
    # acessivel em 7474 sem autenticacao para health).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474/db/neo4j/available"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Avaliacao externa (curto prazo, item 6): sem default fraco -
      # NEO4J_PASSWORD tinha um fallback "changeme123" aqui, que
      # ficaria valendo de verdade se alguem ativasse o profile
      # graphrag sem configurar a senha no .env (o Neo4j fica
      # exposto nas portas 7474/7687 do host). "${VAR:?mensagem}" faz
      # o "docker compose --profile graphrag up" falhar explicitamente
      # se NEO4J_PASSWORD nao estiver definida, em vez de subir com
      # uma senha conhecida publicamente.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-REQUIRED_SET_IN_ENV}
    volumes:
      - neo4j_data:/data

  # Redis (opt-in) - NAO sobe com "docker compose up" default, mesmo
  # principio do Neo4j acima (Decisao de Arquitetura #9). Ativar de
  # verdade exige tambem REDIS_URL no .env - ver
  # app/a2a/task_store.py. Avaliacao externa (medio prazo, item 2):
  # persistencia de tasks A2A; o mesmo Redis tambem serve a fila
  # assincrona de diagnostico (RQ) quando essa parte estiver pronta.
  redis:
    image: redis:7.4-alpine
    profiles: ["async"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # Worker RQ (opt-in, mesmo profile "async" do redis acima) -
  # avaliacao externa (medio prazo, item 6): consome a fila de
  # diagnostico (app/queue.py) enfileirada por POST /diagnose/async.
  # Mesma imagem da API (build: .) - precisa do mesmo acesso a
  # Ollama/Qdrant/Langfuse que a API tem, pois "run_diagnosis_job"
  # (app/queue.py) chama o MESMO pipeline (app/agent/graph.py) rodando
  # aqui dentro, nao um subconjunto. Sem REDIS_URL configurada, o
  # worker nao tem o que consumir - "${VAR:?...}" falha explicito ao
  # subir o profile, mesmo principio do NEO4J_PASSWORD acima (sem
  # default fraco/silencioso).
  worker:
    build: .
    profiles: ["async"]
    command:
      - ".venv/bin/rq"
      - "worker"
      - "--url"
      - "${REDIS_URL:-REQUIRED_SET_IN_ENV_FOR_ASYNC_PROFILE}"
      - "diagnosis"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *common-env
    restart: unless-stopped
    # §3.8: condition: service_healthy no redis garante que o worker
    # so sobe depois do Redis estar aceitando conexoes — sem isso, o
    # worker RQ subia e tentava conectar ao Redis que ainda estava
    # inicializando, falhando silenciosamente.
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./data/sample_docs:/app/data/sample_docs:ro


  # ---------------------------------------------------------------------------
  # Fase 4 — Relatórios agendados (COI/IOC, SOC, iPaaS)
  # ---------------------------------------------------------------------------
  # Gera relatórios diários e semanais em Excel + Markdown.
  # Executa como cron container: roda e sai (restart: "no").
  # Agendar via host cron ou orquestrador:
  #   0 6  * * *  docker compose --profile observability run --rm reporter
  #   0 6  * * 1  docker compose --profile observability run --rm reporter --period weekly
  reporter:
    build: .
    profiles: ["observability"]
    command:
      - ".venv/bin/python"
      - "scripts/generate_reports.py"
      - "--period"
      - "${REPORT_PERIOD:-daily}"
      - "--output-dir"
      - "/app/reports"
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      REPORT_PERIOD: "${REPORT_PERIOD:-daily}"
      REPORT_OUTPUT: "/app/reports"
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  ollama_data:
  qdrant_data:
  neo4j_data:
  redis_data:
  postgres_data:
  grafana_data:
