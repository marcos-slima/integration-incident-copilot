name: Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela execuções antigas do mesmo branch quando um novo push chega
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python
        # Lê a versão de .python-version (3.12.13), a mesma do ambiente local
        run: uv python install

      - name: Sincronizar dependências
        run: uv sync --dev

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — formatação
        run: uv run ruff format --check .

      - name: Pytest
        # Exclui testes marcados como integration: eles exigem Qdrant e Ollama,
        # que não existem no runner do GitHub
        run: uv run pytest -m "not integration" -v --tb=short
