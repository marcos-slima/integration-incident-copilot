# GERADO por scripts/promptfoo_split.py blind - nao editar.
# Rodar em packages/dfe: npx promptfoo eval -c promptfooconfig.blind.yaml --no-cache -o p8_blind.json
description: DF-e Copilot - prompt fiscal, split blind (25 casos)
prompts:
- '{{case_id}}'
concurrency: 1
providers:
- id: exec:../../.venv/bin/python scripts/promptfoo_provider.py qwen3.6:35b-a3b
  label: 'local: qwen3.6:35b-a3b (Ollama) + plugin dfe'
defaultTest:
  assert:
  - type: javascript
    value: (() => { const o = JSON.parse(output); return o.prompt_version.startsWith('dfe-'); })()
  - type: javascript
    value: (() => { const o = JSON.parse(output); return !/(reenvi|cancel|inutiliz|conting)[a-z]*\s+(automatic|imediatament)/i.test(JSON.stringify(o.next_steps)); })()
tests:
- description: UC01-SEMTO-03 (uc01_204_sem_timeout)
  vars:
    case_id: UC01-SEMTO-03
  assert:
  - type: javascript
    value: (() => { const o = JSON.parse(output); return ["F-cStat", "F-204", "G-204"].every(i => o.finding_ids.includes(i)); })()
  - type: javascript
    value: (() => { const o = JSON.parse(output); return !/nf-?e\s+(foi|est[aá])\s+autorizada/i.test(o.probable_root_cause); })()
  - type: javascript
    value: (() => { const o = JSON.parse(output); return /(sem evid|n[aã]o h[aá] evid|inconclusiv|n[aã]o sustent|n[aã]o comprov|G-204|G-539)/i.test(o.probable_root_cause + JSON.stringify(o.next_steps));
      })()
- description: GAP-DV-01 (gap_dv_invalido)
  vars:
    case_id: GAP-DV-01
  assert:
  - type: javascript
    value: (() => { const o = JSON.parse(output); return ["F-cStat", "F-dv"].every(i => o.finding_ids.includes(i)); })()
