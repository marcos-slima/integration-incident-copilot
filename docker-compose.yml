# §3.8: x-common-env extrai as variaveis de ambiente compartilhadas
# entre "api" e "worker" num anchor YAML — elimina a duplicata que
# existia antes (as mesmas 8 vars eram listadas duas vezes). Qualquer
# mudanca de valor agora e feita em UM so lugar.
x-common-env: &common-env
  LLM_PROVIDER: ollama
  OLLAMA_HOST: http://host.docker.internal:11434
  LLM_MODEL: ${LLM_MODEL:-qwen3-coder-next:latest}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  QDRANT_URL: http://qdrant:6333
  # Langfuse e opcional - sem chaves, o app roda normal, so sem
  # tracing (ver app/config.py). Aponte para um Langfuse externo
  # (self-hosted ou cloud) via .env se quiser observabilidade.
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  # Redis e opt-in (profile "async", ver servico abaixo) - vazio
  # por default: sem REDIS_URL, app/a2a/task_store.py cai no fallback
  # em memoria (§3.7: degradacao graciosamente).
  REDIS_URL: ${REDIS_URL:-}
  # Persistência de incidentes (Fase 1 Observabilidade Grafana)
  # Opt-in: vazio = sem PostgreSQL (padrão). Configure no .env para ativar.
  #
  # O host "postgres" é o nome do serviço dentro da rede do compose e
  # NÃO resolve na máquina — é por isso que o .env documenta o
  # DATABASE_URL com 127.0.0.1 (ver .env.example). Aqui o container
  # recebe o valor interno por default, sem depender do .env:
  # mesma estrategia de QDRANT_URL acima, que tambem hardcodeia "qdrant".
  # Para apontar o container a um Postgres externo (RDS, BTP,
  # Cloud SQL), defina CONTAINER_DATABASE_URL em vez de mexer aqui.
  DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-iic}:${POSTGRES_PASSWORD:-REQUIRED_SET_IN_ENV}@postgres:5432/${POSTGRES_DB:-iic}}
  # Neo4j / GraphRAG (opt-in, perfil "graphrag"). O serviço "neo4j"
  # existia no compose mas estas variaveis NAO eram passadas a api,
  # entao o GraphRAG nao tinha como alcancar o banco nem no modo
  # container. Sem NEO4J_URI, app/rag/graph_store.py fica inerte.
  NEO4J_URI: ${CONTAINER_NEO4J_URI:-bolt://neo4j:7687}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
  # Autenticacao da API (header X-API-Key) e do servidor A2A.
  # Vazio = o app gera uma chave aleatoria no startup (DA-18).
  API_KEY: ${API_KEY:-}
  A2A_API_KEY: ${A2A_API_KEY:-}
  # DA-54: login de sessao da UI web. WEB_UI_USERS vazio = login
  # FECHADO (fail-closed); SESSION_SECRET vazio = sessoes efemeras por
  # restart (WARNING no log). Credenciais de MAQUINA ficam acima; o
  # cookie de sessao NAO vale em /mcp, /a2a, /events ou /admin.
  WEB_UI_USERS: ${WEB_UI_USERS:-}
  SESSION_SECRET: ${SESSION_SECRET:-}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
  # DA-46: chave dedicada da superficie admin (X-API-Admin-Key) — mesma
  # regra das outras: vazio = efemera por processo com WARNING no log.
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}

services:
  api:
    # DA-24: o "command:" que sobrescrevia o CMD do Dockerfile para
    # contornar o bug do "uv run" ressincronizando no startup (ver
    # docs/DEPLOY.md secao 4) nao e mais necessario - o Dockerfile ja
    # chama ".venv/bin/uvicorn" diretamente na origem.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      target: final
    # DA-41: .env já montado via volume (line 85), então env_file removido.
    # Sem isso, "docker compose config" falha em checkout limpo (.env ainda não criado).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *common-env
    # §3.8: restart: unless-stopped — reinicia automaticamente apos
    # crash ou apos "docker compose restart", mas nao quando parado
    # manualmente ("docker compose stop"). Evita interrupco de servico
    # por falhas transitórias (OOM, excecao nao tratada, etc.).
    restart: unless-stopped
    # DA-34: condition: service_healthy garante que o Qdrant esteja
    # pronto antes da API comecar a servir requisicoes. O Ollama roda
    # no host (host.docker.internal:11434), fora do compose - ver o
    # servico "ollama" (opt-in) abaixo.
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data/sample_docs:/app/data/sample_docs:ro
      - ./.env:/app/.env:ro

  # Ollama em container (opt-in) - NAO sobe com "docker compose up"
  # default. Por padrao o projeto usa o Ollama do host, via
  # host.docker.internal:11434 (OLLAMA_HOST em x-common-env). Ativar
  # somente em maquinas sem Ollama local:
  #   docker compose --profile container-ollama up -d ollama
  # Atencao: conflita com a porta 11434 se o Ollama do host estiver ativo.
  ollama:
    image: ollama/ollama:0.34.1
    profiles: ["container-ollama"]
    # DA-34: healthcheck — a imagem oficial nao inclui curl/wget; o
    # proprio CLI do Ollama testa se o servidor responde.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    ports:
      # Validacao 2026-10-07 (M-18): loopback, como os demais servicos.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:v1.19.0
    # DA-34: healthcheck — a imagem oficial não inclui curl/wget;
    # verifica a porta 6333 via /dev/tcp do bash.
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # PostgreSQL — persistência de incidentes (Fase 1 Observabilidade).
  # Opt-in via profile "observability": nao sobe no stack default para
  # manter o ambiente de desenvolvimento leve. Ativar:
  #   docker compose --profile observability up -d postgres grafana
  # TimescaleDB (para retenção automática + hypertable):
  #   Substituir imagem por timescale/timescaledb:latest-pg16
  postgres:
    image: postgres:16-alpine
    profiles: ["observability"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iic -d iic"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: iic
      POSTGRES_USER: iic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?REQUIRED_SET_IN_ENV}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Grafana — dashboards COI/IOC, SOC, iPaaS (Fase 3 Observabilidade).
  # Opt-in via profile "observability" (mesmo do postgres acima).
  # Provisioning automático via ./deploy/grafana/ (Fase 3).
  # URL default: http://localhost:3001 (3000 reservado ao Langfuse local).
  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?REQUIRED_SET_IN_ENV}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      # Datasource (deploy/grafana/provisioning/datasources/postgres.yml).
      # Validacao 2026-10-07 (M-17): sem GRAFANA_DB_USER/PASSWORD no .env o
      # Grafana usa o DONO do banco (comportamento anterior). Recomendado:
      # GRAFANA_DB_USER=iic_grafana_ro + GRAFANA_DB_PASSWORD, criado pela
      # migration 013 (rode `alembic upgrade head` com GRAFANA_DB_PASSWORD).
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-iic}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-${POSTGRES_PASSWORD:?REQUIRED_SET_IN_ENV}}
      GRAFANA_DB_SSLMODE: ${GRAFANA_DB_SSLMODE:-disable}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Mailpit — SMTP testing local (zero custo, total offline)
  # Permite visualizar e-mails enviados via http://localhost:8025
  mailpit:
    # M-18: versao fixa (era :latest - cada pull trazia outra imagem).
    image: axllent/mailpit:v1.31
    profiles: ["mailpit"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"  # Web UI
      - "127.0.0.1:1025:1025"  # SMTP
    environment:
      MP_MAX_MESSAGES: "1000"
      MP_DATABASE: "/data/mailpit.db"
    volumes:
      - mailpit_data:/data

  # GraphRAG (opt-in) - NAO sobe com "docker compose up" default, so
  # com "docker compose --profile graphrag up -d neo4j" (decisao
  # consciente de manter o stack default leve, ver Decisao de
  # Arquitetura #9 no README e docs/ARCHITECTURE.md). Ativar de verdade
  # exige tambem GRAPH_RAG_ENABLED=true no .env - ver
  # app/rag/graph_store.py.
  neo4j:
    image: neo4j:5.26.0-community
    profiles: ["graphrag"]
    # DA-34: healthcheck. O comentario anterior dizia que
    # /db/neo4j/available respondia sem autenticacao, e isso era verdade em
    # versoes antigas: no 5.26 o endpoint devolve 401, e `curl -f` falha em
    # 401. Pior: a imagem neo4j:5.26.0-community nao tem `curl` (so `wget`),
    # entao o healthcheck era `curl: not found` em TODA execucao — o
    # container ficava `unhealthy` para sempre e nunca melhorava. Nenhum
    # `depends_on` consulta o estado, entao nada quebrava: o healthcheck
    # mentia sem consequencia observavel, que e' a forma mais facil de um
    # sinal de saude apodrecer. Agora usa `wget` na raiz (200 sem auth),
    # igual ao healthcheck do job neo4j-smoke no CI.
    # CMD-SHELL, e nao CMD: em exec form nao ha shell, entao `|| exit 1`
    # viraria ARGUMENTO do wget (ele tentaria baixar a URL "||") e o health
    # check ficaria pendurado em vez de reprovar. Verificado nos dois modos.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Avaliacao externa (curto prazo, item 6): sem default fraco -
      # NEO4J_PASSWORD tinha um fallback "changeme123" aqui, que
      # ficaria valendo de verdade se alguem ativasse o profile
      # graphrag sem configurar a senha no .env (o Neo4j fica
      # exposto nas portas 7474/7687 do host). "${VAR:?mensagem}" faz
      # o "docker compose --profile graphrag up" falhar explicitamente
      # se NEO4J_PASSWORD nao estiver definida, em vez de subir com
      # uma senha conhecida publicamente.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?REQUIRED_SET_IN_ENV}
    volumes:
      - neo4j_data:/data

  # Redis (opt-in) - NAO sobe com "docker compose up" default, mesmo
  # principio do Neo4j acima (Decisao de Arquitetura #9). Ativar de
  # verdade exige tambem REDIS_URL no .env - ver
  # app/a2a/task_store.py. Avaliacao externa (medio prazo, item 2):
  # persistencia de tasks A2A; o mesmo Redis tambem serve a fila
  # assincrona de diagnostico (RQ) quando essa parte estiver pronta.
  redis:
    image: redis:7.4-alpine
    profiles: ["async"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"  # A-12: bind loopback por padrao
    volumes:
      - redis_data:/data
    # A-12: autenticacao via REDIS_PASSWORD (opt-in); se vazio, sobe sem senha
    # (compativel com dev local sem Redis protegido). Em producao, defina
    # REDIS_PASSWORD no .env e configure o mesmo valor em REDIS_URL.
    command: >
      sh -c "if [ -n "$$REDIS_PASSWORD" ]; then
               redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
             else
               redis-server --appendonly yes;
             fi"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

  # Worker RQ (opt-in, mesmo profile "async" do redis acima) -
  # avaliacao externa (medio prazo, item 6): consome a fila de
  # diagnostico (app/queue.py) enfileirada por POST /diagnose/async.
  # Mesma imagem da API (build: .) - precisa do mesmo acesso a
  # Ollama/Qdrant/Langfuse que a API tem, pois "run_diagnosis_job"
  # (app/queue.py) chama o MESMO pipeline (app/agent/graph.py) rodando
  # aqui dentro, nao um subconjunto. Sem REDIS_URL configurada, o
  # worker nao tem o que consumir - "${VAR:?...}" falha explicito ao
  # subir o profile, mesmo principio do NEO4J_PASSWORD acima (sem
  # default fraco/silencioso).
  worker:
    build:
      context: .
      target: app
    profiles: ["async"]
    command:
      - ".venv/bin/rq"
      - "worker"
      - "--url"
      - "${REDIS_URL:-REQUIRED_SET_IN_ENV_FOR_ASYNC_PROFILE}"
      - "diagnosis"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *common-env
    restart: unless-stopped
    # §3.8: condition: service_healthy no redis garante que o worker
    # so sobe depois do Redis estar aceitando conexoes — sem isso, o
    # worker RQ subia e tentava conectar ao Redis que ainda estava
    # inicializando, falhando silenciosamente.
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./data/sample_docs:/app/data/sample_docs:ro
      # M-18: o worker executa o MESMO pipeline da API, mas nao lia o .env -
      # politica de soberania, provider e chaves podiam diferir entre o
      # caminho sincrono (/diagnose) e o assincrono (fila).
      - ./.env:/app/.env:ro


  # ---------------------------------------------------------------------------
  # Fase 5 — Notificações (DA-55: email/SMS via MessagePit)
  # ---------------------------------------------------------------------------

  # MessagePit — SMTP email + Twilio-compatible SMS testing local
  # Fork do Mailpit com SMS Twilio-compatible ingest (porta 8200)
  # Permite visualizar emails e SMS via http://localhost:8025
  messagepit:
    # M-18: fixado por digest (o projeto nao publica tags de versao) e com
    # portas de host proprias - antes usava 8025/1025 como o mailpit, e os
    # dois perfis juntos nao subiam. SMS continua sem provedor no app
    # (SMS_PROVIDER so aceita vazio); este servico so serve para inspecao.
    image: ghcr.io/coreydaley/messagepit@sha256:04bd1a2f82c8b90aec52c6bfa4090ef1088acb025f5193f75112207886ef0a02
    profiles: ["messagepit"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MESSAGEPIT_UI_PORT:-8026}:8025"  # Web UI (email + SMS)
      - "127.0.0.1:${MESSAGEPIT_SMTP_PORT:-1026}:1025"  # SMTP (email)
      - "127.0.0.1:8200:8200"  # Twilio-compatible SMS ingest
    environment:
      MP_MAX_MESSAGES: "1000"
      MP_DATABASE: "/data/messagepit.db"
    volumes:
      - messagepit_data:/data

  # ---------------------------------------------------------------------------
  # Fase 4 — Relatórios agendados (COI/IOC, SOC, iPaaS)
  # ---------------------------------------------------------------------------
  # Gera relatórios diários e semanais em Excel + Markdown.
  # Executa como cron container: roda e sai (restart: "no").
  # Agendar via host cron ou orquestrador:
  #   0 6  * * *  docker compose --profile observability run --rm reporter
  #   0 6  * * 1  docker compose --profile observability run --rm reporter --period weekly
  reporter:
    build:
      context: .
      target: app
    profiles: ["observability"]
    entrypoint:
      - ".venv/bin/python"
      - "scripts/generate_reports.py"
      - "--output-dir"
      - "/app/reports"
    command:
      - "--period"
      - "${REPORT_PERIOD:-daily}"
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      REPORT_PERIOD: "${REPORT_PERIOD:-daily}"
      REPORT_OUTPUT: "/app/reports"
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  ollama_data:
  qdrant_data:
  neo4j_data:
  redis_data:
  postgres_data:
  grafana_data:
  mailpit_data:
  messagepit_data:
