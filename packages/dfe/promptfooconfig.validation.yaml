# GERADO por scripts/promptfoo_split.py validation - nao editar.
# Rodar em packages/dfe: npx promptfoo eval -c promptfooconfig.validation.yaml --no-cache -o p8_validation.json
description: DF-e Copilot - prompt fiscal, split validation (23 casos)
prompts:
- '{{case_id}}'
concurrency: 1
providers:
- id: exec:../../.venv/bin/python scripts/promptfoo_provider.py qwen3.6:35b-a3b
  label: 'local: qwen3.6:35b-a3b (Ollama) + plugin dfe'
defaultTest:
  assert:
  - type: javascript
    value: (() => { const o = JSON.parse(output); return o.prompt_version.startsWith('dfe-'); })()
  - type: javascript
    value: (() => { const o = JSON.parse(output); return !/(reenvi|cancel|inutiliz|conting)[a-z]*\s+(automatic|imediatament)/i.test(JSON.stringify(o.next_steps)); })()
tests:
- description: UC01-H1-03 (uc01_204_reenvio)
  vars:
    case_id: UC01-H1-03
  assert:
  - type: javascript
    value: (() => { const o = JSON.parse(output); return ["F-cStat", "F-204", "H1"].every(i => o.finding_ids.includes(i)); })()
  - type: javascript
    value: (() => { const o = JSON.parse(output); return !/nf-?e\s+(foi|est[aá])\s+autorizada/i.test(o.probable_root_cause); })()
  - type: javascript
    value: (() => { const o = JSON.parse(output); return !/tpAmb\W{0,3}2\W{0,3}\(?\s*produ/i.test((o.probable_root_cause + JSON.stringify(o.next_steps))); })()
  - type: javascript
    value: (() => { const o = JSON.parse(output); return !/n[aã]o (e |é )?sustent/i.test(o.probable_root_cause); })()
  - type: javascript
    value: (() => { const o = JSON.parse(output); return /consult/i.test(JSON.stringify(o.next_steps)); })()
