description: "Avaliacao qwen3.8:27b (producao) no diagnostico do SAP Integration Copilot (pipeline real: conector + RAG + guardrails)"

prompts:
  - file://prompts/case.txt

concurrency: 1

providers:
  - id: "exec:uv run python3 scripts/promptfoo_provider.py qwen3.8:27b"
    label: "qwen3.8 (producao atual)"

# Validacao 2026-10-07 (M-21): `metadata.path` diz QUEM responde o caso no
# pipeline atual - "rule_engine" (regra deterministica, DA-33; o LLM nem e
# chamado) ou "llm". So os casos "llm" medem o modelo/prompt; o placar total
# mistura os dois. Para medir so o modelo:
#   npx promptfoo eval -c promptfooconfig.yaml --filter-metadata path=llm
# As duas "repeticoes de estabilidade" do IDoc 51 foram removidas: eram o
# mesmo caso tres vezes (e caem no rule engine). Estabilidade se mede com
# `--repeat 3`, que repete TODOS os casos.
tests:
  # DA-33: o Rule Engine responde antes do LLM para erros conhecidos e
  # devolve matched_source = "rule_engine:<categoria>". Os asserts de IDoc 51
  # e RFC connection refused aceitam o documento RAG OU a regra equivalente.
  - description: "401 sem conector"
    metadata: { path: "llm" }
    vars: { description: "iFlow falhando com erro 401", interface_type: "none", identifier: "none" }
    assert:
      - type: javascript
        value: "JSON.parse(output).matched_source === 'cpi_http_401.md'"

  - description: "401 com conector OData"
    metadata: { path: "llm" }
    vars: { description: "investigar falha reportada no iFlow", interface_type: "odata", identifier: "CPI-401-DEMO" }
    assert:
      - type: javascript
        value: "JSON.parse(output).matched_source === 'cpi_http_401.md' && JSON.parse(output).confidence >= 0.6"

  - description: "IDoc 51 com conector RFC (caso que ja quebrou 2x manualmente)"
    metadata: { path: "rule_engine" }
    vars: { description: "IDoc travado", interface_type: "rfc", identifier: "RFC-IDOC-51-DEMO" }
    assert:
      - type: javascript
        value: "['idoc_status_51.md','rule_engine:sap_idoc_status_51'].includes(JSON.parse(output).matched_source) && JSON.parse(output).confidence >= 0.6"

  - description: "RFC connection refused com conector"
    metadata: { path: "rule_engine" }
    vars: { description: "SM59 não conecta", interface_type: "rfc", identifier: "RFC-CONN-REFUSED-DEMO" }
    assert:
      - type: javascript
        value: "['rfc_connection_refused.md','rule_engine:network_connection_refused'].includes(JSON.parse(output).matched_source) && JSON.parse(output).confidence >= 0.6"

  - description: "OData timeout sem conector"
    metadata: { path: "llm" }
    vars: { description: "iFlow travando ao consumir OData sem retorno", interface_type: "none", identifier: "none" }
    assert:
      - type: javascript
        value: "JSON.parse(output).matched_source === 'odata_timeout_cpi.md'"

  - description: "IDoc 51 sem conector"
    metadata: { path: "rule_engine" }
    vars: { description: "IDoc parado com status 51", interface_type: "none", identifier: "none" }
    assert:
      - type: javascript
        value: "['idoc_status_51.md','rule_engine:sap_idoc_status_51'].includes(JSON.parse(output).matched_source)"

  - description: "RFC connection refused sem conector"
    metadata: { path: "rule_engine" }
    vars: { description: "SM59 dando erro de conexão recusada", interface_type: "none", identifier: "none" }
    assert:
      - type: javascript
        value: "['rfc_connection_refused.md','rule_engine:network_connection_refused'].includes(JSON.parse(output).matched_source)"

  - description: "Identificador desconhecido - guardrail de seguranca (nao deve ter alta confianca)"
    metadata: { path: "llm" }
    vars: { description: "algo estranho aconteceu", interface_type: "odata", identifier: "XPTO-999-NAO-EXISTE" }
    # DA: exige ABSTENCAO, nao "confianca baixa".
    #
    # A versao anterior era so `confidence < 0.6`, que passa tanto quando o
    # guardrail funciona quanto quando o sistema acerta o documento ERRADO
    # com numero baixo - o caso do broker mostra exatamente esse numero
    # (salesforce_case_sap_sync_failure.md com confidence 0.001) e ele
    # passaria. O que separa as duas situacoes e' matched_source: o
    # guardrail correto devolve null em vez de anexar um documento qualquer.
    # Medido nos 3 providers em 2026-09-28: matched_source=null e' o
    # comportamento real e consistente.
    # Trapped por tests/test_eval_suite_integrity.py, que recusa assert
    # com `confidence` como unica afirmacao.
    assert:
      - type: javascript
        # Multi-linha vira CORPO de funcao no promptfoo (sem return
        # implicito) -> exige `return`, senao o resultado e' undefined e o
        # caso reprova em QUALQUER modelo. Ver comentario equivalente em
        # promptfooconfig.compare.yaml e tests/test_eval_suite_integrity.py.
        value: |
          const o = JSON.parse(output);
          return o.matched_source === null && o.confidence < 0.6;

  # --- Casos da validacao manual de 26/09/2026 (ambiente Docker + Ollama do host) ---
  # Resultado manual: 33% com causa raiz errada, construida sobre o "500"
  # fabricado pelo _DEFAULT do mock OData. Apos a correcao em
  # _build_diagnosis_prompt (fallback nao injeta status/codigo), a causa
  # nao pode mais citar o 500 simulado.
  - description: "OData com conector em fallback (sem identifier) - nao pode usar o 500 do mock"
    metadata: { path: "llm" }
    vars: { description: "Pedidos do Salesforce nao chegam ao S/4HANA. OData retorna Read timed out after 60000 ms.", interface_type: "odata", identifier: "none" }
    assert:
      - type: javascript
        value: "const o = JSON.parse(output); o.confidence < 0.6 && !/\\b500\\b/.test(o.probable_root_cause)"

  # Resultado manual: 40%, causa correta com prefixo "confianca limitada".
  - description: "OData timeout com identifier desconhecido - causa correta, confianca limitada"
    metadata: { path: "llm" }
    vars: { description: "Chamada OData do CPI para o S/4HANA excede o tempo limite (Read timed out after 60000 ms)", interface_type: "odata", identifier: "SO-SF-000123" }
    assert:
      - type: javascript
        value: "const o = JSON.parse(output); o.confidence <= 0.4 && /timeout|tempo limite|filtro/i.test(o.probable_root_cause)"

  # DA-33: o Rule Engine responde antes do LLM para este identificador
  # conhecido e devolve matched_source = "rule_engine:http_timeout" (nao o
  # documento RAG). O assert aceita os dois, como os demais casos
  # path=rule_engine. Ate 2026-10-11 ele exigia so 'odata_timeout_cpi.md' e
  # reprovava sempre (medido: matched_source='rule_engine:http_timeout').
  - description: "OData timeout com CPI-TIMEOUT-DEMO - documento e sistema convergem"
    metadata: { path: "rule_engine" }
    vars: { description: "Chamada OData do CPI para o S/4HANA excede o tempo limite", interface_type: "odata", identifier: "CPI-TIMEOUT-DEMO" }
    assert:
      - type: javascript
        value: "const o = JSON.parse(output); ['odata_timeout_cpi.md','rule_engine:http_timeout'].includes(o.matched_source) && o.confidence >= 0.8"

  # --- Casos "quase-iguais" (2026-10-11) - endurecer a discriminacao ---
  # A suite tinha UM unico caso com poder discriminativo (o guardrail de
  # abstencao); os outros 5 eram resolvidos por TODOS os 4 modelos locais
  # medidos. Estes casos usam pares que os PROPRIOS documentos distinguem
  # (ex.: "connection refused" e' imediato; pool de gateway esgotado conecta
  # e estoura ~60s). A descricao evoca os DOIS sintomas e so' o detalhe
  # decide - por isso medem raciocinio sobre o documento recuperado, nao eco
  # de palavra-chave (ver tests/test_eval_suite_integrity.py). Todos com
  # interface_type=none para garantir path=llm: nenhum texto casa
  # KNOWN_ERROR_RULES (DA-33).
  #
  # Medicao 2026-10-11 (qwen3.8:27b, qwen3-coder-next, qwen3.6:35b-a3b e
  # qwen3-coder): os QUATRO modelos fizeram 6/6 nestes casos. Eles endurecem
  # a suite (pegam confusao entre docs quase-iguais e regressao de abstenção)
  # mas NAO discriminam estes modelos: o gargalo e' a recuperacao (os docs sao
  # keyword-rich e o reranker acha o certo), nao a decisao do LLM.
  - description: "RFC pool esgotado no fechamento - nao e connection refused"
    metadata: { path: "llm" }
    vars: { description: "Chamada RFC sincrona via destino SM59 falha apos cerca de 60 segundos com SYSTEM_FAILURE durante o fechamento de mes; nao ha falha imediata de conexao e o destino responde a outros testes.", interface_type: "none", identifier: "none" }
    assert:
      - type: javascript
        value: "JSON.parse(output).matched_source === 'rfc_gateway_pool_timeout.md'"

  - description: "OData mudou de contrato apos patch - nao e timeout"
    metadata: { path: "llm" }
    vars: { description: "Depois do ultimo patch do S/4HANA o consumidor OData passou a receber 404 ao ler uma propriedade; o servico responde, mas o campo nao existe mais no $metadata.", interface_type: "none", identifier: "none" }
    assert:
      - type: javascript
        value: "JSON.parse(output).matched_source === 'odata_contract_drift.md'"

  - description: "API Management barra por volume e proxy de 55s - nao e 401 do SAP"
    metadata: { path: "llm" }
    vars: { description: "O gateway de API Management rejeita chamadas quando o volume sobe e outras cortam perto de 55 segundos; o backend S/4HANA responde normalmente quando chamado direto.", interface_type: "none", identifier: "none" }
    assert:
      - type: javascript
        value: "JSON.parse(output).matched_source === 'apim_gateway_auth_throttle.md'"

  - description: "Mensagem presa no PO sem avancar - nao e duplicidade nem ordem"
    metadata: { path: "llm" }
    vars: { description: "Uma mensagem no monitor do SAP PO/PI aparece como em processamento e nao avanca, sem ser concluida com sucesso; o time suspeita de lentidao do backend SAP.", interface_type: "none", identifier: "none" }
    assert:
      - type: javascript
        value: "JSON.parse(output).matched_source === 'po_pi_stuck_message.md'"

  - description: "Case Salesforce - falha silenciosa no middleware, nao e o ITSM"
    metadata: { path: "llm" }
    vars: { description: "Um Case no Salesforce relata que um pedido criado no CRM nao aparece no SAP; o envio do Salesforce ao middleware teve sucesso e nao ha erro visivel no lado CRM.", interface_type: "none", identifier: "none" }
    assert:
      - type: javascript
        value: "JSON.parse(output).matched_source === 'salesforce_case_sap_sync_failure.md'"

  # Segundo guardrail: generaliza a abstencao (um caso sozinho pode ser sorte).
  # Medido 2026-10-11: os 4 modelos abstêm (matched_source=null) - nao separa
  # os modelos, mas trava o comportamento contra regressao.
  - description: "Guardrail 2 - identificador desconhecido plausivel (nao deve anexar doc)"
    metadata: { path: "llm" }
    vars: { description: "Nao sei dizer o que esta errado, so que a integracao parou de funcionar ontem.", interface_type: "none", identifier: "INT-2026-Q3-XYZ" }
    assert:
      - type: javascript
        value: |
          const o = JSON.parse(output);
          return o.matched_source === null && o.confidence < 0.6;
