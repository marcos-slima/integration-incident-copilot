    mechanisms: {apis: supported, events: none, idoc: none, rfc: none, soap: none, odata: none, files: none, data_integration: supported, integration_suite: supported}

  # --- middleware SAP: o repo tem conector, a fonte NAO tem linha ----------
  # Acrescentados por nos (DA-58). Sem matriz de mecanismos porque a fonte
  # nao cobre middleware: `unknown` e' a resposta honesta, `none` seria
  # uma negativa inventada.
  - name: Process Orchestration / PI
    kind: sap_middleware
    note: "Linha acrescentada por nos: a fonte cobre produtos, nao middleware. O repo tem `POConnector` (DA-56)."
    mechanisms: {apis: unknown, events: unknown, idoc: unknown, rfc: unknown, soap: unknown, odata: unknown, files: unknown, data_integration: unknown, integration_suite: unknown}

  - name: API Management
