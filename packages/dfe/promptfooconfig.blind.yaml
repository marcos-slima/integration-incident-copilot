  - type: javascript
    value: (() => { const o = JSON.parse(output); return !/nf-?e\s+(foi|est[aá])\s+autorizada/i.test(o.probable_root_cause); })()
  - type: javascript
    value: (() => { const o = JSON.parse(output); return !/cStat\s*\d{3}/i.test(o.probable_root_cause); })()
- description: UC01-RET-01 (uc01_204_em_retorno_de_lote)
