[project]
name = "dfe-copilot"
version = "0.1.0"
description = "DF-e Copilot: diagnostico de incidentes de documentos fiscais eletronicos (NF-e) sobre o core do IIC"
requires-python = ">=3.12"
license = {text = "MIT"}
# O core é dependência explícita; uv resolve seu pacote pelo workspace.
dependencies = ["copilot-core==1.4.0", "lxml>=6.1", "pydantic>=2.13"]

[tool.uv.sources]
copilot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfe_copilot"]

[tool.hatch.build.targets.wheel.force-include]
"data/schemas" = "dfe_copilot/_data/schemas"
"data/corpus/manifest.json" = "dfe_copilot/_data/corpus/manifest.json"
"data/corpus/cstat_moc7_anexo_i.json" = "dfe_copilot/_data/corpus/cstat_moc7_anexo_i.json"
"data/corpus/regra_2B08-20.md" = "dfe_copilot/_data/corpus/regra_2B08-20.md"
"data/corpus/NT_2018.005_v1.51.pdf" = "dfe_copilot/_data/corpus/NT_2018.005_v1.51.pdf"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
# DA-94: o produto roda a propria suite, com a propria config, a partir de
# packages/dfe; o core é instalado, não inserido via pythonpath.
testpaths = ["tests"]
pythonpath = ["src"]
