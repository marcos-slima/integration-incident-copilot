name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Instalar dependencias
        # extra "openai" e necessario aqui: tests/test_llm_factory.py
        # exercita o provedor ChatOpenAI/AzureChatOpenAI do LLM Gateway
        # (com chave falsa, sem chamada de rede real), o que exige o
        # pacote langchain-openai instalado.
        run: uv sync --extra openai

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Rodar testes unitarios
        # Toda a pasta tests/, exceto os marcados @pytest.mark.integration
        # (esses precisam de Qdrant/Ollama locais, que nao existem no
        # runner do GitHub). Antes so test_connectors.py era executado
        # aqui - test_llm_factory.py (LLM Gateway) ficava sem cobertura
        # de CI. Isso testa conectores, o LLM Gateway, contratos e
        # regras de negocio puras, sem depender de infraestrutura externa.
        run: uv run pytest tests/ -m "not integration" -v
