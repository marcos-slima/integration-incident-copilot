# DA-24: TEMPLATE, nao um Secret real - nenhum valor abaixo funciona
# como credencial. NUNCA commite este arquivo preenchido com segredos
# de verdade (gitleaks/pre-commit deste repo bloqueariam isso, mas a
# regra vale mesmo fora deste repo). Fluxo recomendado:
#
#   cp deploy/kyma/secret.example.yaml /tmp/secret.yaml
#   # edite /tmp/secret.yaml com os valores reais
#   kubectl apply -f /tmp/secret.yaml
#   rm /tmp/secret.yaml
#
# Ou, preferencialmente num landscape BTP real, gerencie via um
# cofre externo (SAP Credential Store, HashiCorp Vault, um External
# Secrets Operator) em vez de um Secret estatico do Kubernetes.
apiVersion: v1
kind: Secret
metadata:
  name: integration-incident-copilot-secrets
  namespace: integration-incident-copilot
type: Opaque
stringData:
  # DA-18/DA-23/IIC-AUD-410: o ConfigMap define REQUIRE_AUTH=true. Se
  # qualquer uma destas quatro chaves estiver vazia (ou com nome errado), o
  # startup ABORTA em vez de gerar uma chave efemera por replica - o que
  # mudaria a cada restart/rollout e quebraria integracoes externas.
  # Preencha as quatro antes de aplicar este Secret.
  API_KEY: "CHANGE-ME-diagnose-api-key"
  A2A_API_KEY: "CHANGE-ME-a2a-api-key"
  EVENT_MESH_API_KEY: "CHANGE-ME-event-mesh-webhook-key"
  ADMIN_API_KEY: "CHANGE-ME-admin-api-key"
  # DA-54: segredo HMAC dos cookies da UI. So e usado com WEB_UI_USERS
  # preenchido; vazio = efemero POR REPLICA (um cookie emitido num pod e
  # rejeitado nos outros). Fixe se ligar o login da UI.
  SESSION_SECRET: "CHANGE-ME-session-hmac-secret"
  # Redis (DA-30/DA-59) — necessario para idempotencia, A2A, rate limit e
  # circuit breaker distribuidos entre replicas. O valor de REDIS_PASSWORD
  # DEVE ser gerado aleatoriamente e mantido seguro (com Fernet, se
  # possivel). O Redis configurado em REDIS_URL deve suportar autenticacao
  # com senha; se o Redis estiver sem autenticacao, deixe REDIS_PASSWORD
  # vazio (nao recomendado em producao).
  REDIS_PASSWORD: "CHANGE-ME-redis-password"
  # URL completa (redis://:<senha>@redis:6379/0) com a MESMA senha acima (o app le so REDIS_URL; o worker
  # recebe via RQ_REDIS_URL, injetado a partir deste Secret - IIC-AUD-314).
  REDIS_URL: "CHANGE-ME-redis://:<REDIS_PASSWORD>@redis:6379/0"
  # GraphRAG (opcional): senha do Neo4j apontado por NEO4J_URI no ConfigMap.
  NEO4J_PASSWORD: "CHANGE-ME-neo4j-password"
  # LLM (DA-20) - preencha o(s) provider(s) configurado(s) no
  # ConfigMap (LLM_PROVIDER/LLM_FALLBACK_PROVIDER).
  OPENAI_API_KEY: "CHANGE-ME-openai-key"
  AZURE_OPENAI_API_KEY: "CHANGE-ME-azure-openai-key"
  AZURE_OPENAI_ENDPOINT: "CHANGE-ME-https://<resource>.openai.azure.com"
  AZURE_OPENAI_DEPLOYMENT: "CHANGE-ME-deployment-name"
  # Langfuse (opcional - omita as duas linhas abaixo do Secret real se
  # nao for usar observabilidade).
  LANGFUSE_PUBLIC_KEY: "CHANGE-ME-langfuse-public-key"
  LANGFUSE_SECRET_KEY: "CHANGE-ME-langfuse-secret-key"
