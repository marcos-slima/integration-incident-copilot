# DA-24: Deployment da API. A imagem usa o Dockerfile deste repositorio
# (corrigido nesta mesma fase: uv.lock + --frozen para build
# reproduzivel, usuario nao-root, CMD chamando .venv/bin/uvicorn direto
# - ver Dockerfile e docs/DEPLOY.md secao 4).
#
# <REGISTRY>/sap-integration-copilot:<tag> e um placeholder - troque
# pelo registry real (ex: o Docker registry gerenciado pela conta BTP,
# ou qualquer registry que o cluster Kyma consiga puxar).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sap-integration-copilot
  namespace: sap-integration-copilot
  labels:
    app.kubernetes.io/name: sap-integration-copilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sap-integration-copilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sap-integration-copilot
    spec:
      # DA-24: mesmo UID nao-root criado no Dockerfile (appuser, uid
      # 1000) - reforcado aqui a nivel de Pod, nao so de imagem, para
      # que um PodSecurityStandard "restricted" do cluster nao rejeite
      # o Pod mesmo se alguem trocar a imagem sem perceber essa
      # exigencia.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "<REGISTRY>/sap-integration-copilot:<TAG>"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sap-integration-copilot-config
            - secretRef:
                name: sap-integration-copilot-secrets
          # §4.3: liveness e readiness agora apontam para endpoints
          # distintos (avaliacao externa §3.6 — antes ambos usavam /health,
          # que apos DA-35 passou a fazer probe de Qdrant/Ollama, causando
          # restart-loop incorreto quando o Qdrant esta fora).
          # /health = liveness: processo FastAPI vivo? (sem IO externo)
          # /ready  = readiness: Qdrant/Ollama/Redis acessiveis? (B-07)
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            # /ready faz ate 3 probes sequenciais (Qdrant/Ollama/Redis, 1s
            # cada) - o timeout default de 1s do kubelet cortaria a resposta.
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # DA-24: requests/limits ajustados para carga real (medido:
          # app.main ~350MB, CrossEncoder ~420MB, overhead ~200MB = ~1GB real).
          # 512Mi causava OOMKill; 1024Mi garante estabilidade.
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
