[project]
name = "dfe-copilot"
version = "0.1.0"
description = "DF-e Copilot: diagnostico de incidentes de documentos fiscais eletronicos (NF-e) sobre o core do IIC"
requires-python = ">=3.12"
license = {text = "MIT"}
# O core (integration-incident-copilot) e' a dependencia; no monorepo ele e'
# resolvido pelo ambiente da raiz (uv) e por `pythonpath` do pytest.
dependencies = ["lxml>=6.1", "pydantic>=2.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfe_copilot"]
